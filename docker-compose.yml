version: '3.8'

services:
  server:
    image: rogueserver:latest
    restart: unless-stopped
    volumes:
      - ./csv:/app/csv
    environment:
      debug: "true"
      dbaddr: db
      dbuser: pokerogue
      dbpass: pokerogue
      dbname: pokeroguedb
      gameurl: http://35.209.125.149 #http://localhost:8000
      callbackurl: http://35.209.125.149 #http://localhost:8001
      # Jaeger OTLP gRPC 엔드포인트 설정 (포트 4317)
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "jaeger:4317"
    depends_on:
      db:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - internal
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  db:
    image: mariadb:11
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: pokeroguedb
      MYSQL_USER: pokerogue
      MYSQL_PASSWORD: pokerogue
    volumes:
      - /mnt/ssd/database:/var/lib/mysql
      - ./mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf   # 설정 파일 로드
      - ./init-permissions.sql:/docker-entrypoint-initdb.d/init-permissions.sql
    networks:
      - internal
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 5G
        reservations:
          cpus: '0.3'
          memory: 3G

  mysqld_exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld_exporter
    restart: always
    ports:
      - "9104:9104"
    command:
      - "--mysqld.username=pokerogue:pokerogue"
      - "--mysqld.address=db:3306"
    environment:
      - DATA_SOURCE_NAME=pokerogue:pokerogue@(db:3306)/
    depends_on:
      - db
    networks:
      - internal
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 0.3G
        reservations:
          cpus: '0.2'
          memory: 0.2G

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 0.2G
        reservations:
          cpus: '0.1'
          memory: 0.1G

  # Jaeger 서비스 추가
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    networks:
      - internal # server 서비스와 통신을 위해 internal 네트워크에 연결
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M

volumes:
  mariadb_data:

networks:
  internal:
    driver: bridge
  
  monitoring_network:
    driver: bridge
